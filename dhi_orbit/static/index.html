<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHI Orbit</title>
<style>
:root{--bg:#f3f4f7;--panel:#fff;--soft:#f7f8fa;--ink:#1c2230;--mute:#6b7385;--line:#e3e6ec;--acc:#2f6fed;
--need:#d9480f;--work:#2f6fed;--ready:#2b8a3e;--idle:#868e96;--stop:#adb5bd;--code:#eef0f3;--warm:#2b8a3e;--cool:#e8590c;--cold:#868e96}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101318;--panel:#191e26;--soft:#1f252e;--ink:#e6e9ef;--mute:#98a1b3;--line:#2a313d;--acc:#6e9bff;--code:#242b36}}
:root[data-theme="dark"]{--bg:#101318;--panel:#191e26;--soft:#1f252e;--ink:#e6e9ef;--mute:#98a1b3;--line:#2a313d;--acc:#6e9bff;--code:#242b36}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:6px}
h1{font-size:16px;margin:0 6px 0 0}h3{font-size:14px;margin:16px 0 6px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.bad{border-color:var(--need);color:var(--need)}.btn.good{border-color:var(--ready);color:var(--ready)}
.btn:disabled{opacity:.5;cursor:default}.btn.sm{font-size:12px;padding:2px 8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:12px;padding:2px 9px;cursor:pointer;white-space:nowrap;background:var(--panel);color:var(--ink)}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}.hot{color:var(--need);font-weight:600}.pill.on .hot{color:#fff}
.lbl{font-size:12px;color:var(--mute)}main{padding:14px 16px}
.banner{background:#fff4e6;color:#a33b00;border:1px solid #ffd8a8;border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:13px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner{background:#3a2412;color:#ffc078;border-color:#6b3d17}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.focus{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:250px;flex:1}
.fbox h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}.fbox a{display:block;font-size:13px;cursor:pointer;color:var(--ink);text-decoration:none;padding:2px 0}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between}
.grp{font-size:12px;color:var(--mute);margin:10px 0 6px;border-bottom:1px dashed var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:10px;margin-bottom:12px;overflow:hidden}
.card.needs_you{border-left-color:var(--need)}.card.working{border-left-color:var(--work)}.card.ready{border-left-color:var(--ready)}.card.stopped{border-left-color:var(--stop);opacity:.85}
.card.cooling{box-shadow:0 0 0 2px var(--cool)}
.sec{padding:8px 12px}.sec+.sec{border-top:1px solid var(--line)}
.head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.name{font-weight:600;cursor:pointer;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.chip{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;white-space:nowrap;color:var(--mute);background:var(--soft)}
.chip.acct{color:var(--ink)}.folder{font:11px ui-monospace,monospace;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w{font-size:11px;border-radius:10px;padding:1px 8px;white-space:nowrap;color:#fff;flex-shrink:0}.w.warm{background:var(--warm)}.w.cooling{background:var(--cool);animation:pulse 1.6s infinite}.w.cold{background:var(--cold)}
@keyframes pulse{50%{opacity:.55}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ready);margin-right:5px;vertical-align:middle}
.pin{cursor:pointer;color:var(--mute);margin-right:4px}.pin.on{color:#f59f00}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:2px}
.you{font-size:12.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ansbox{background:var(--soft)}.final{max-height:8.5em;overflow:hidden;position:relative;font-size:13px;cursor:pointer}.final.open{max-height:none;cursor:auto}
.final:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2em;background:linear-gradient(transparent,var(--soft))}
.foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.foot .sp{flex:1}
.prs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.prs a{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;text-decoration:none;color:var(--acc)}
.warn{color:var(--need);font-size:12px}.err{color:var(--need)}.meta{font-size:12px;color:var(--mute)}
.perm{background:var(--code);border-radius:8px;padding:8px 10px;font-size:12.5px}.perm code{white-space:pre-wrap;word-break:break-all}
.md pre{background:var(--code);padding:8px;border-radius:6px;overflow:auto;font-size:12px}.md code{background:var(--code);padding:0 3px;border-radius:3px;font-size:12px}
.md table{border-collapse:collapse;font-size:12px;margin:4px 0;display:block;overflow:auto}.md td,.md th{border:1px solid var(--line);padding:2px 6px;text-align:left}
.said{font-size:12px;color:var(--mute);opacity:.85;border-left:2px solid var(--line);padding-left:8px;margin:3px 0}
.md h3{font-size:13.5px;margin:6px 0 3px}.md p{margin:4px 0}.md ul{margin:4px 0;padding-left:18px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(800px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.15);display:none;flex-direction:column;z-index:10}
#drawer.on{display:flex}#dhead{padding:10px 14px;border-bottom:1px solid var(--line)}#dbody{flex:1;overflow:auto;padding:10px 14px}
#dfoot{border-top:1px solid var(--line);padding:10px 14px}#dfoot textarea{width:100%;min-height:70px}
.turn{margin-bottom:16px}.turn .youq{background:var(--code);border-radius:8px;padding:6px 9px;font-size:13px;white-space:pre-wrap}
.turn .ans{padding:6px 2px}.turn .ts{font-size:11px;color:var(--mute)}
table.list{width:100%;border-collapse:collapse;background:var(--panel);border-radius:8px}table.list td,table.list th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px;vertical-align:top}
.off{color:var(--need)}.on2{color:var(--ready)}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:30;max-width:90vw}
.diff{font:11px ui-monospace,monospace;white-space:pre-wrap;max-height:10em;overflow:auto;background:var(--code);padding:4px;border-radius:4px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;position:relative}
.chart svg{width:100%;height:220px;display:block}.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 7px;border-radius:6px;display:none;white-space:nowrap;z-index:3}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:4px}.legend span{cursor:pointer}.legend .off2{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:5vh 12px}
.modal.on{display:flex}.mbox{background:var(--panel);border-radius:12px;max-width:760px;width:100%;padding:16px}
.wsitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}.wsitem:hover,.wsitem.sel{border-color:var(--acc)}
.wsitem b{margin-right:6px}.digest .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.mob{display:none}
@media (max-width:700px){header{padding:6px 12px}.mob{display:inline-block}#hdtog{margin-left:auto}#cur{font-size:13px;color:var(--mute)}
  header.collapsed #tabs,header.collapsed #q,header.collapsed #newbtn,header.collapsed #theme,header.collapsed .row+.row{display:none}
  header:not(.collapsed) #cur{display:none}#q{flex:1;min-width:0}main{padding:12px}}
</style>
</head>
<body>
<header>
  <div class="row"><h1>DHI Orbit</h1><a class="btn" href="/v2/" title="DHI Orbit v2: decisions, receipts, capacity, work items, graph">v2</a><span id="cur" class="mob"></span><button class="btn mob" id="hdtog" aria-expanded="false" title="show or hide the menu and filters">Menu ▾</button><span id="tabs" class="row"></span>
    <input id="q" placeholder="Search all chats (/)" size="22">
    <button class="btn pri" id="newbtn">New chat</button><button class="btn" id="theme" title="theme">◐</button><span id="err" class="err"></span></div>
  <div class="row"><span class="lbl">accounts</span><span id="accts" class="row"></span></div>
  <div class="row"><span class="lbl">show</span><span id="kinds" class="row"></span><span class="lbl">cache</span><span id="warms" class="row"></span>
    <input id="f" placeholder="filter name / folder" size="16"><span class="lbl">group</span><select id="group"><option value="">none</option><option value="account">account</option><option value="ws">work item</option></select></div>
</header>
<main id="main"></main>
<aside id="drawer"><div id="dhead"></div><div id="dbody"></div><div id="dfoot"></div></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<footer style="padding:10px 16px;font-size:12px;color:var(--mute,#888)">DHI Orbit, built by Dev Sanghvi at <a href="https://dhi-tech.com" target="_blank" rel="noopener">DHI</a></footer>
<script>
const TOKEN="__TOKEN__";
const PUBLIC_URL="__PUBLIC_URL__";
const DEFAULT_CWD="__DEFAULT_CWD__";
const TABS=["Board","Approvals","Costs","Digest","Seats","Schedules","Search"];
const KINDS=[["bg","background"],["interactive","terminal tabs"],["headless","headless"],["closed","closed"]];
const WARMS=[["all","any"],["warm","warm"],["cooling","cooling"],["cold","cold"]];
const COLORS=["#2f6fed","#e8590c","#2b8a3e","#ae3ec9","#f59f00","#0ca678","#e03131","#1098ad","#7048e8","#d6336c","#5c940d","#495057","#fd7e14","#15aabf","#9c36b5","#868e96"];
const store={get(k,d){try{const v=localStorage.getItem("cd."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cd."+k,JSON.stringify(v))}catch(e){}}};
let tab=store.get("tab","Board"),F=Object.assign({accts:[],kinds:["bg","interactive"],warm:"all",text:"",group:"",stopped:false},store.get("filters",{})),pins=store.get("pins",[]);
let S={chats:[],seats:{}},openKey=null,BUILD=null,H=null,hidden=new Set(store.get("hiddenSeries",[]));
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,body){const r=await fetch(p,{method:body?"POST":"GET",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});return r.json()}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",6000)}
function ago(ts){if(!ts)return"-";const s=(Date.now()-new Date(typeof ts==="number"?ts*1000:ts).getTime())/1000;if(s<60)return Math.round(s)+"s";if(s<3600)return Math.round(s/60)+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d"}
function k(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":String(Math.round(n||0))}
function save(){store.set("filters",F);store.set("tab",tab);store.set("pins",pins)}
function md(src){
  const blocks=[];src=(src||"").replace(/```[^\n]*\n([\s\S]*?)```/g,(m,c)=>{blocks.push(c);return"\u0000"+(blocks.length-1)+"\u0000"});
  const lines=esc(src).split("\n");let out=[],i=0;
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  while(i<lines.length){const l=lines[i];
    if(/^\|/.test(l)&&i+1<lines.length&&/^\|[\s:|-]+\|?$/.test(lines[i+1])){const row=x=>x.replace(/^\||\|$/g,"").split("|");
      let h="<table><tr>"+row(l).map(c=>"<th>"+inl(c.trim())+"</th>").join("")+"</tr>";i+=2;
      while(i<lines.length&&/^\|/.test(lines[i])){h+="<tr>"+row(lines[i]).map(c=>"<td>"+inl(c.trim())+"</td>").join("")+"</tr>";i++}out.push(h+"</table>");continue}
    if(/^#{1,4} /.test(l)){out.push("<h3>"+inl(l.replace(/^#+ /,""))+"</h3>");i++;continue}
    if(/^\s*([-*]|\d+\.) /.test(l)){let h="<ul>";while(i<lines.length&&/^\s*([-*]|\d+\.) /.test(lines[i])){h+="<li>"+inl(lines[i].replace(/^\s*([-*]|\d+\.) /,""))+"</li>";i++}out.push(h+"</ul>");continue}
    if(l.trim()===""){i++;continue}
    out.push("<p>"+inl(l)+"</p>");i++}
  return out.join("").replace(/\u0000(\d+)\u0000/g,(m,n)=>"<pre>"+esc(blocks[+n])+"</pre>")}
function seatTxt(a){const s=S.seats[a];if(!s||!s.ok)return esc(a);const hot=Math.max(s.five||0,s.seven||0)>=80;return`${esc(a)} <span class="${hot?"hot":""}">${Math.round(s.five)}/${Math.round(s.seven)}</span>`}
function kwBadge(c){const w=c.kw;if(!w)return"";
  if(w.on)return` <span class="w warm" title="Auto keep warm is on: a tiny ping about every hour, ${w.pings} sent, about ${w.units} units so far, stops in ${w.stop_in_h} h">auto-warm${w.next_min!=null?" · ping in "+w.next_min+"m":""}</span>`;
  return w.status&&w.status!=="off"?` <span class="w cold" title="${esc(w.detail||"")}">auto-warm ended: ${esc(w.status)}</span>`:""}
function warmBadge(c){return warmBadge0(c)+kwBadge(c)}
function warmBadge0(c){if(!c.warmth)return"";if(c.warmth==="warm")return`<span class="w warm" title="prompt cache warm">warm${c.state==="working"?"":" · "+Math.round(c.cools_in_min)+"m"}</span>`;
  if(c.warmth==="cooling")return`<span class="w cooling" title="cache expires soon; reply or Keep warm now">cools in ${Math.max(1,Math.round(c.cools_in_min))}m</span>`;
  return`<span class="w cold" title="cache expired; next message re-caches the whole context">cold · ~${k(c.ctx_tokens)}</span>`}
function urgency(c){return(c.state==="needs_you"?0:c.warmth==="cooling"?1:c.unread?2:3)*1e6+(c.warmth==="cooling"?c.cools_in_min*1000:0)-(c.activity||0)/1e6}
function visible(){const t=F.text.toLowerCase();return S.chats.filter(c=>(!F.accts.length||F.accts.includes(c.account))&&F.kinds.includes(c.kind)
  &&(F.warm==="all"||c.warmth===F.warm)&&(!t||(c.name+" "+(c.cwd||"")).toLowerCase().includes(t)))
  .sort((a,b)=>(pins.includes(b.key)-pins.includes(a.key))||urgency(a)-urgency(b))}
function filterBar(){
  $("#accts").innerHTML=`<span class="pill ${F.accts.length?"":"on"}" data-acct="">all</span>`+Object.keys(S.seats).map(a=>`<span class="pill ${F.accts.includes(a)?"on":""}" data-acct="${esc(a)}" title="5h / 7d %">${seatTxt(a)}</span>`).join("");
  $("#kinds").innerHTML=KINDS.map(([id,t])=>`<span class="pill ${F.kinds.includes(id)?"on":""}" data-kind="${id}">${t}</span>`).join("");
  $("#warms").innerHTML=WARMS.map(([id,t])=>`<span class="pill ${F.warm===id?"on":""}" data-warm="${id}">${t}</span>`).join("")
    +`<span class="lbl" style="margin-left:6px">column</span><span class="pill ${F.stopped?"on":""}" data-stopped="1">stopped</span>`;
  if(document.activeElement!==$("#f"))$("#f").value=F.text;$("#group").value=F.group}
function banner(){const hot=Object.values(S.seats).filter(s=>s.ok&&(s.five>=80||s.seven>=80));
  return hot.length?`<div class="banner">Near the limit: ${hot.map(s=>`<b>${esc(s.account)}</b> 5h ${Math.round(s.five)}% / 7d ${Math.round(s.seven)}%`).join(" · ")}. Move new work to a cooler account.</div>`:""}
function permBox(c){if(c.state!=="needs_you")return"";const d=c.dialog,K=esc(c.key);
  if(!c.job_id)return`<div class="sec"><div class="perm"><b>waiting in a terminal tab</b>${c.pending_tool?`<div><code>${esc(c.pending_tool)}</code></div>`:""}<div class="meta">Answer it there. <button class="btn sm" data-term="${K}">Bring up Terminal</button></div></div></div>`;
  if(!d)return`<div class="sec"><div class="perm"><b>${esc(c.waiting_for||"waiting")}</b>${c.pending_tool?`<div><code>${esc(c.pending_tool)}</code></div>`:""}<div class="meta">No dialog readable right now. <button class="btn sm" data-term="${K}">Terminal</button></div></div></div>`;
  const opt=o=>o.free?`<div class="foot"><input size="36" placeholder="${esc(o.label)}" id="free-${K}-${o.n}"><button class="btn sm pri" data-ans="${o.n}" data-k="${K}" data-label="${esc(o.label)}" data-free="1">Send answer</button></div>`
    :`<div><button class="btn sm ${d.kind==="permission"&&/^no/i.test(o.label)?"bad":d.kind==="permission"&&/^yes/i.test(o.label)?"good":""}" data-ans="${o.n}" data-k="${K}" data-label="${esc(o.label)}">${o.n}. ${esc(o.label)}</button>${o.desc?`<div class="meta">${esc(o.desc)}</div>`:""}</div>`;
  return`<div class="sec"><div class="perm"><b>${d.kind==="permission"?"Permission":"Question"}</b>${d.tabs?` <span class="meta">${esc(d.tabs)}</span>`:""}
  <div>${esc(d.question)}</div>${c.pending_tool&&d.kind==="permission"?`<div><code>${esc(c.pending_tool)}</code></div>`:""}
  <div style="margin-top:6px;display:grid;gap:5px">${d.options.map(opt).join("")}</div>
  <div class="foot" style="margin-top:6px"><button class="btn sm" data-ans="0" data-k="${K}">Esc (cancel)</button><button class="btn sm" data-term="${K}">Terminal</button></div></div></div>`}
function shortPath(p){p=(p||"").replace(/^\/Users\/[^/]+/,"~");const parts=p.split("/");return parts.length>4?"…/"+parts.slice(-3).join("/"):p}
function actionBtns(c,inDrawer){const K=esc(c.key),warmish=c.warmth==="warm"||c.warmth==="cooling",idle=c.state==="idle"&&c.job_id;
  return`${inDrawer?"":`<button class="btn sm" data-open="${K}">Open</button>`}
  ${idle&&warmish?`<button class="btn sm" data-keepwarm="${K}" title="sends a tiny ping so the cache stays warm for another hour">Keep warm</button>`:""}
  ${c.job_id&&(warmish||(c.kw&&c.kw.on))?`<button class="btn sm ${c.kw&&c.kw.on?"good":""}" data-kwauto="${K}" data-on="${c.kw&&c.kw.on?1:0}" title="${c.kw&&c.kw.on?"Auto keep warm is on. Click to turn it off.":"A tiny ping just before the cache expires, for up to 12 h, only while the chat is idle. It stops by itself if a ping ever re-writes the context."}">${c.kw&&c.kw.on?"Auto-warm: on":"Auto-warm"}</button>`:""}
  ${idle&&warmish&&c.ctx_tokens>60000?`<button class="btn sm" data-compact="${K}" title="/compact now while warm; the next start is ~30-40k instead of ${k(c.ctx_tokens)}">Compact</button>`:""}
  <span class="sp"></span>${inDrawer?"":`<button class="btn sm" data-copy="${K}">Copy</button>`}<button class="btn sm" data-term="${K}">Terminal</button>${c.job_id&&c.live?`<button class="btn sm bad" data-stop="${K}">Stop</button>`:""}`}
function card(c){
  const age=c.state==="working"?ago(c.last_prompt_at):ago(c.final_at||c.last_prompt_at);
  return`<div class="card ${c.column} ${c.warmth==="cooling"?"cooling":""}">
  <div class="sec"><div class="head"><span class="name" data-open="${esc(c.key)}"><span class="pin ${pins.includes(c.key)?"on":""}" data-pin="${esc(c.key)}" title="pin">★</span>${c.unread?'<span class="dot"></span>':""}${esc(c.name)}</span>${warmBadge(c)}</div>

function lineChart(id,series,opts){const W=900,Hh=220,P=34;const all=series.filter(s=>!hidden.has(s.name)).flatMap(s=>s.pts);

function barChart(id,days,groups,title){const W=900,Hh=240,P=40;const tot=days.map(d=>groups.reduce((a,g)=>a+(hidden.has(g.name)?0:(g.by[d]||0)),0));

function closeModal(){$("#modal").classList.remove("on")}
function newModal(){modal(`<div class="head"><b>New chat</b><button class="btn sm" id="mclose">Close</button></div>
  <div class="lab">account (blank = most headroom, never a read-only one)</div><select id="nacct"><option value="">auto</option>${Object.keys(S.seats).map(a=>`<option>${a}</option>`).join("")}</select>
  <div class="lab" style="margin-top:8px">folder (must be trusted in that account)</div><input id="ncwd" value="${esc(DEFAULT_CWD)}" size="40">
  <div class="lab" style="margin-top:8px">name</div><input id="nname" value="new chat" size="40">
  <div class="lab" style="margin-top:8px">first message</div><textarea id="ntext" style="width:100%;min-height:70px"></textarea>
  <div class="foot" style="margin-top:8px"><button class="btn pri" id="ngo">Start</button><span id="nres" class="meta"></span></div>`)}
/* ---------- events ---------- */
document.addEventListener("click",async e=>{const el=e.target.closest("[data-tab],[data-open],[data-term],[data-stop],[data-unread],[data-ans],[data-acct],[data-kind],[data-warm],[data-stopped],[data-pin],[data-copy],[data-tpl],[data-keepwarm],[data-kwauto],[data-kwall],[data-compact],[data-bulk],[data-sched],[data-range],[data-costby],[data-series],[data-copylink]")||e.target;const d=el.dataset||{};
  if(d.tab){tab=d.tab;save();if(PHONE.matches)setHdr(true);render()}
  else if(d.acct!==undefined){if(!d.acct)F.accts=[];else F.accts=F.accts.includes(d.acct)?F.accts.filter(x=>x!==d.acct):[...F.accts,d.acct];save();render()}
  else if(d.kind){F.kinds=F.kinds.includes(d.kind)?F.kinds.filter(x=>x!==d.kind):[...F.kinds,d.kind];save();render()}
  else if(d.warm){F.warm=d.warm;save();render()}
  else if(d.stopped){F.stopped=!F.stopped;save();render()}
  else if(d.pin){e.stopPropagation();pins=pins.includes(d.pin)?pins.filter(x=>x!==d.pin):[...pins,d.pin];save();render()}
  else if(d.open){e.preventDefault();drawer(d.open)}
  else if(d.copy){const c=S.chats.find(x=>x.key===d.copy);try{await navigator.clipboard.writeText(c.final||"");toast("copied")}catch(err){toast("copy blocked by browser")}}
  else if(d.copylink){try{await navigator.clipboard.writeText($("#plink").value);toast("link copied")}catch(err){$("#plink").select();toast("press Cmd+C")}}
  else if(d.tpl){$("#rtext").value=d.tpl;$("#rtext").focus()}
  else if(d.term){const r=await api("/api/open",{key:d.term});toast(r.ok?"Terminal opened on the Mac":"failed: "+(r.error||""))}
  else if(d.unread){await api("/api/unseen",{key:d.unread});toast("marked unread");setTimeout(load,500)}
  else if(d.stop){if(confirm("Stop this background session? Its conversation is kept; Reply reopens it.")){el.disabled=true;const r=await api("/api/stop",{key:d.stop});toast(r.ok?"stopped":"stop failed: "+(r.out||r.error||""));setTimeout(load,800)}}
  else if(d.kwall!==undefined){const on=d.kwall==="1";const r=await api("/api/keepwarm_all",{on:!on});toast(r.ok?(on?"auto keep-warm off":"auto keep-warm on: chats with 5 min left get the ping by themselves"):"failed");setTimeout(load,800)}
  else if(d.kwauto){el.disabled=true;const on=d.on==="1";const r=await api("/api/keepwarm_auto",{key:d.kwauto,on:!on});toast(r.ok?(on?"auto-warm off":"auto-warm on: pings about hourly, up to "+r.hours+" h"):r.error||"failed");setTimeout(load,1200)}
  else if(d.keepwarm){el.disabled=true;const r=await api("/api/keepwarm",{key:d.keepwarm});toast(r.ok?"keep-alive sent: warm for another hour":"failed: "+(r.error||""));setTimeout(load,1500)}
  else if(d.compact){if(confirm("Compact this chat now? It summarises the conversation so the next start is ~30-40k.")){el.disabled=true;const r=await api("/api/compact",{key:d.compact});toast(r.ok?"compacting (takes a minute)":"failed: "+(r.error||""));setTimeout(load,1500)}}
  else if(d.bulk){const what={allow_all:"Allow every waiting permission prompt (plain Yes)?",compact_big:"Compact every warm idle chat over 500k?",compact_warm:"Compact every warm idle chat over 60k?"}[d.bulk];
    if(confirm(what)){const r=await api("/api/bulk",{action:d.bulk});toast(r.ok?`started on ${r.count}: ${r.targets.join(", ").slice(0,160)}`:"failed: "+r.error);setTimeout(load,2000)}}
  else if(d.sched){if(confirm((d.on==="1"?"Turn on ":"Turn off ")+d.sched+"?")){const r=await api("/api/sched",{label:d.sched,on:d.on==="1"});toast(r.ok?"done":"failed: "+r.error);render()}}
  else if(d.range){range=+d.range;store.set("range",range);render()}
  else if(d.costby){costBy=d.costby;store.set("costBy",costBy);render()}
  else if(d.series){hidden.has(d.series)?hidden.delete(d.series):hidden.add(d.series);store.set("hiddenSeries",[...hidden]);render()}
  else if(d.ans!==undefined){const text=d.free?(document.getElementById(`free-${d.k}-${d.ans}`)||{}).value||"":"";
    if(d.free&&!text.trim()){toast("type the answer first");return}
    el.disabled=true;toast("answering...");const r=await api("/api/permission",{key:d.k,n:+d.ans,label:d.label||"",text});
    toast(r.ok?`sent: ${r.sent}${r.next?" (next: "+r.next.question.slice(0,60)+")":""}`:"failed: "+(r.error||""));setTimeout(load,1500)}
  else if(e.target.id==="dclose"){$("#drawer").classList.remove("on");openKey=null}
  else if(e.target.id==="mclose"||e.target.id==="modal")closeModal()
  else if(e.target.id==="unqueue"){await api("/api/queue",{key:openKey,text:""});toast("queue cleared")}
  else if(e.target.id==="rsend")send()
  else if(e.target.id==="mic")toggleMic(e.target)
  else if(e.target.id==="theme"){const r=document.documentElement,n=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=n;store.set("theme",n)}
  else if(e.target.id==="newbtn")newModal()
  else if(e.target.id==="ngo"){const t=$("#ntext").value;if(!t.trim()){toast("write the first message");return}e.target.disabled=true;$("#nres").textContent="starting...";
    const r=await api("/api/new",{account:$("#nacct").value,cwd:$("#ncwd").value,name:$("#nname").value,text:t});$("#nres").textContent=r.ok?`started on ${r.account} (job ${r.job_id})`:"failed: "+r.error;e.target.disabled=false;setTimeout(load,2000)}
  else if(e.target.closest(".final")){e.target.closest(".final").classList.toggle("open")}});
document.addEventListener("mousemove",e=>{const box=e.target.closest(".chart");if(!box)return;const tip=box.querySelector(".tip");
  if(e.target.dataset&&e.target.dataset.tip){tip.textContent=e.target.dataset.tip;tip.style.display="block";const r=box.getBoundingClientRect();tip.style.left=(e.clientX-r.left+12)+"px";tip.style.top=(e.clientY-r.top-10)+"px";return}
  const svg=box.querySelector("svg[data-x0]");if(!svg||!H){tip.style.display="none";return}
  const r=svg.getBoundingClientRect(),W=+svg.dataset.w,P=+svg.dataset.p,x0=+svg.dataset.x0,x1=+svg.dataset.x1,vx=(e.clientX-r.left)/r.width*W;
  if(vx<P){tip.style.display="none";return}const t=x0+(vx-P)/(W-P-8)*(x1-x0);const field=box.dataset.chart==="five"?1:2;
  const vals=Object.keys(S.seats).filter(a=>!hidden.has(a+(field===1?" 5h":" 7d"))).map(a=>{const pts=(H.seats[a]||[]).filter(p=>p[0]<=t&&p[field]!=null);const p=pts[pts.length-1];return p?`${a} ${p[field]}%`:null}).filter(Boolean);
  const cur=svg.querySelector(".cursor");cur.setAttribute("x1",vx);cur.setAttribute("x2",vx);cur.style.display="";
  tip.innerHTML=`<b>${new Date(t*1000).toLocaleString([], {weekday:"short",hour:"2-digit",minute:"2-digit"})}</b><br>${vals.join("<br>")||"no data"}`;tip.style.display="block";
  const bx=box.getBoundingClientRect();tip.style.left=Math.min(e.clientX-bx.left+12,bx.width-160)+"px";tip.style.top=(e.clientY-bx.top+10)+"px"});
document.addEventListener("mouseleave",e=>{},true);
document.addEventListener("keydown",e=>{const a=document.activeElement.tagName;if(e.key==="/"&&a!=="INPUT"&&a!=="TEXTAREA"){e.preventDefault();$("#q").focus()}
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&document.activeElement.id==="rtext")send();if(e.key==="Escape"){$("#drawer").classList.remove("on");openKey=null;closeModal()}});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){tab="Search";save();render()}});
$("#f").addEventListener("input",e=>{F.text=e.target.value;save();if(tab==="Board")$("#main").innerHTML=board()});
$("#group").addEventListener("change",e=>{F.group=e.target.value;save();render()});
{const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t}
const PHONE=matchMedia("(max-width:700px)");
function setHdr(c){$("header").classList.toggle("collapsed",c);$("#hdtog").textContent=c?"Menu ▾":"Hide ▴";$("#hdtog").setAttribute("aria-expanded",String(!c));store.set("hdrCollapsed",c)}
setHdr(store.get("hdrCollapsed",true));
$("#hdtog").addEventListener("click",()=>setHdr(!$("header").classList.contains("collapsed")));
async function load(){try{S=await api("/api/state");if(BUILD&&S.build&&S.build!==BUILD){location.reload();return}BUILD=BUILD||S.build;$("#err").textContent=S.error||"";
  if(["Board","Approvals"].includes(tab)||!$("#tabs").innerHTML)render();else{filterBar();if(openKey)drawer(openKey,true)}}catch(e){$("#err").textContent="server unreachable"}}
load();const es=new EventSource("/api/events?token="+TOKEN);es.onmessage=load;setInterval(load,20000);
</script>
</body>
</html>
