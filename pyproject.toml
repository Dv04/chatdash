[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhi-orbit"
version = "0.3.12"
description = "A local dashboard for every Claude Code, Codex and Cursor chat on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dev Sanghvi" }]
keywords = ["claude-code", "codex", "cursor", "dashboard", "local"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development",
]
dependencies = [          # standard library only, except on Windows
    "pywinpty>=2.0; sys_platform == 'win32'",     # ConPTY: `claude attach` and sign-in run on a pseudo-terminal
    "tzdata; sys_platform == 'win32'",            # Windows has no IANA time zone database for zoneinfo
]

[project.scripts]
dhi-orbit = "dhi_orbit.server:main"
orbit = "dhi_orbit.server:main"
dhi-orbit-ask-hook = "dhi_orbit.cp.hooks.ask_hook:cli"
dhi-orbit-stop-hook = "dhi_orbit.cp.hooks.stop_hook:cli"
dhi-orbit-statusline = "dhi_orbit.statusline:main"
# legacy names from before the rename, so existing installs and hook settings keep working
chatdash = "dhi_orbit.server:main"
chatdash-ask-hook = "dhi_orbit.cp.hooks.ask_hook:cli"
chatdash-stop-hook = "dhi_orbit.cp.hooks.stop_hook:cli"
chatdash-statusline = "dhi_orbit.statusline:main"

[tool.setuptools]
packages = ["dhi_orbit", "dhi_orbit.providers", "dhi_orbit.cp", "dhi_orbit.cp.hooks", "chatdash", "chatdash.cp", "chatdash.cp.hooks"]

[tool.setuptools.package-data]
dhi_orbit = ["ui/*", "ui/js/*", "ui/css/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# the code base keeps short one-line helpers and lambdas on purpose
ignore = ["E702", "E731", "E741"]
